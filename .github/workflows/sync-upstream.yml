name: Sync Upstream

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    name: Sync fork with upstream
    runs-on: ubuntu-latest

    steps:
      - name: Sync default branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh repo sync ${{ github.repository }} --branch main
